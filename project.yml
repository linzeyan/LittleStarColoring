name: Coloring
options:
  bundleIdPrefix: com.zeyanlin
  deploymentTarget:
    # The test iPad is a mini 4 (A8, 2 GB), whose last OS is iPadOS 15. Hand-me-down
    # iPads are what small children actually get, so this floor is a product decision.
    iOS: "15.0"
  developmentLanguage: zh-Hant

targets:
  Coloring:
    type: application
    platform: iOS
    sources:
      - path: Coloring
        excludes:
          - Info.plist
          - Resources/Pages
          - Resources/Stamps
      # A folder reference is copied verbatim. regions.png is read byte-for-byte as
      # region IDs, so nothing in the build may re-encode it.
      - path: Coloring/Resources/Pages
        type: folder
        buildPhase: resources
      # A folder too, so the stamps' LICENSE ships beside them, not loose in the bundle.
      - path: Coloring/Resources/Stamps
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyanlin.littlestarcoloring
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Coloring/Info.plist
        # Same reason as the folder reference: Xcode's PNG crush rewrites PNGs into
        # Apple's premultiplied variant, which would corrupt the region IDs.
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
        # One 1024 px icon; Xcode renders the smaller sizes iOS 15 still asks for.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Simulator: ad-hoc signing, no Apple account needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        # Device / TestFlight / App Store: standard automatic signing.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        DEVELOPMENT_TEAM[sdk=iphoneos*]: NKJSLB6HBR

  # Xcode 27's XCTest needs iOS 17, so neither test bundle can run on the iPadOS 15
  # mini 4: they run on simulators, and the mini 4 is checked by hand.
  ColoringTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColoringTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Coloring

  # Drives the real UI. Kept out of `make test` because it boots the app per case.
  ColoringUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColoringUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Coloring

schemes:
  Coloring:
    build:
      targets:
        Coloring: all
        ColoringTests: [test]
        ColoringUITests: [test]
    test:
      targets:
        - ColoringTests
        - ColoringUITests
    run:
      config: Debug
